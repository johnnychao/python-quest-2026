<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 冒險之旅 2026 · 老師工具</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#EEF3F1; --bg2:#F8FAF9; --paper:#FFFFFF; --ink:#14313A; --ink2:#4A6269; --line:#CFDAD6;
  --sea:#237A86; --sea2:#DCEFF0; --stamp:#C8412B; --gold:#B8860B; --gold2:#FFF4D6;
  --ok:#2F8F5B; --warn:#B7791F; --shadow:0 6px 24px rgba(20,49,58,.08);
  --f-display:"LXGW WenKai TC","Noto Serif TC","Microsoft JhengHei","PingFang TC",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2227; --bg2:#132B31; --paper:#183840; --ink:#E6EFEC; --ink2:#A9C0BC; --line:#2B4D55;
    --sea:#62BCC8; --sea2:#1B434B; --stamp:#F07A62; --gold:#E8C160; --gold2:#3B3417;
    --ok:#6CCB93; --warn:#E0A84A; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F2227; --bg2:#132B31; --paper:#183840; --ink:#E6EFEC; --ink2:#A9C0BC; --line:#2B4D55;
  --sea:#62BCC8; --sea2:#1B434B; --stamp:#F07A62; --gold:#E8C160; --gold2:#3B3417;
  --ok:#6CCB93; --warn:#E0A84A; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.65;font-size:16px;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 0);background-size:28px 28px}
a{color:var(--sea)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{font-family:var(--f-display);font-size:1.25rem;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--sea);margin-left:8px;letter-spacing:.08em}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink2);padding:6px 10px;border-radius:999px;font-size:.9rem}
.nav a:hover,.nav a:focus-visible{background:var(--sea2);color:var(--ink)}
/* hero */
.hero{padding:40px 0 20px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:start}
.hero h1{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:700;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--sea)}
.hero .lead{color:var(--ink2);max-width:34em;margin:14px 0 0;font-size:1.05rem}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:.85rem;color:var(--ink2)}
/* adventurer card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.adv h2{font-size:1.1rem;color:var(--ink2);font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-family:var(--f-mono)}
.adv .who{display:flex;gap:10px;align-items:center;margin-top:10px}
.adv input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink)}
.adv input:focus-visible,.stamp-form input:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .12s ease, background .12s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.btn-sea{background:var(--sea);color:#fff;border-color:var(--sea)}
.btn-colab{background:var(--gold2);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--ink)}
.btn-stamp{background:var(--stamp);color:#fff;border-color:var(--stamp)}
.adv .rank{display:flex;align-items:baseline;gap:12px;margin-top:16px;flex-wrap:wrap}
.adv .rank .title{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.adv .rank .xp{font-family:var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.adv .stats{display:flex;gap:18px;margin-top:12px;font-size:.9rem;color:var(--ink2);flex-wrap:wrap}
.adv .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line);font-size:1.1rem;filter:grayscale(1);opacity:.45;background:var(--bg2)}
.badge.on{filter:none;opacity:1;border:2px solid var(--gold);background:var(--gold2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
/* today */
.today{margin:18px 0 0;border-radius:14px;padding:14px 18px;background:var(--sea2);border:1px solid color-mix(in srgb,var(--sea) 35%,var(--line));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.today .t-label{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;color:var(--sea);text-transform:uppercase}
.today b{font-family:var(--f-display);font-size:1.15rem}
.today .t-links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.today .t-links a{font-size:.85rem}
/* map */
.map{margin:28px 0 8px}
.map h2{font-size:1.5rem;margin-bottom:6px}
.map p.sub{color:var(--ink2);margin:0 0 10px}
.chart{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--sea2),var(--bg2));box-shadow:var(--shadow)}
.chart text{font-family:var(--f-display);fill:var(--ink)}
.chart .isl-label{font-size:15px;font-weight:700}
.chart .isl-sub{font-size:11px;fill:var(--ink2);font-family:var(--f-mono)}
.chart .route{fill:none;stroke:var(--ink2);stroke-width:2;stroke-dasharray:6 7;opacity:.7}
.chart .node{cursor:pointer}
.chart .node:hover .blob{filter:brightness(1.08)}
.chart .blob{stroke:var(--paper);stroke-width:3}
.chart .flag{font-size:22px}
.chart .done-ring{fill:none;stroke:var(--gold);stroke-width:3}
/* islands */
.island{margin:34px 0 0;padding:22px;border-radius:20px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.island-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.island-day{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;color:var(--island);background:color-mix(in srgb,var(--island) 12%,var(--paper));padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--island) 40%,transparent)}
.island h3{font-size:1.6rem;margin:8px 0 4px}
.island-theme{margin:0;color:var(--ink2)}
.island-ch{margin:6px 0 0;font-size:.9rem;color:var(--ink2)}
.island-progress{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:64px;height:64px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:3.2}
.ring-fg{fill:none;stroke:var(--island);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;transition:stroke-dashoffset .8s ease}
.ring-num{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.island-badge{font-size:.85rem;padding:5px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--ink2)}
.island.complete .island-badge{border:2px solid var(--gold);background:var(--gold2);color:var(--ink);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.lv{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);overflow:hidden;transition:box-shadow .2s}
.lv:hover{box-shadow:var(--shadow)}
.lv.kind-boss,.lv.kind-final{background:linear-gradient(160deg,color-mix(in srgb,var(--island) 10%,var(--bg2)),var(--bg2));border-color:color-mix(in srgb,var(--island) 40%,var(--line))}
.lv-head{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--ink2)}
.lv-id{font-weight:700;color:var(--island);letter-spacing:.06em}
.lv-kind{padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--island) 14%,var(--paper))}
.lv-xp{margin-left:auto;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.lv-name{font-size:1.12rem;display:flex;gap:8px;align-items:center}
.lv-book{margin:0;font-size:.82rem;color:var(--ink2)}
.lv-goals summary{cursor:pointer;font-size:.85rem;color:var(--sea)}
.lv-goals ul{margin:6px 0 0;padding-left:18px;font-size:.88rem;color:var(--ink2)}
.lv-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.stamp-form{display:flex;gap:6px}
.stamp-form input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-transform:uppercase}
.stamp-form .btn{padding:8px 12px}
.stamp{position:absolute;right:14px;bottom:14px;width:84px;height:84px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:none;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;transform:rotate(-14deg);background:color-mix(in srgb,var(--stamp) 8%,transparent);mix-blend-mode:multiply;pointer-events:none}
.stamp-txt{font-size:1.35rem;line-height:1}
.stamp-date{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;margin-top:3px}
.lv.cleared .stamp{display:flex;animation:stampIn .45s cubic-bezier(.2,1.4,.4,1)}
.lv.cleared .stamp-form{display:none}
.lv.cleared{border-color:color-mix(in srgb,var(--stamp) 40%,var(--line))}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.2);opacity:0}60%{transform:rotate(-14deg) scale(.95);opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.cheat{margin-top:16px}
.cheat summary{cursor:pointer;font-weight:600;color:var(--sea)}
pre{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.55;margin:10px 0 0}
/* stamp book */
.book{margin:34px 0 0}
.book h2,.supply h2{font-size:1.5rem;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;grid-template-rows:auto 1fr auto;padding:8px;background:var(--paper);position:relative}
.slot-id{font-family:var(--f-mono);font-size:.7rem;color:var(--ink2)}
.slot-emoji{font-size:1.5rem;filter:grayscale(1);opacity:.35}
.slot-mark{font-family:var(--f-display);font-size:.8rem;color:var(--stamp);opacity:0;transform:rotate(-12deg)}
.slot.on{border:2px solid var(--stamp);background:color-mix(in srgb,var(--stamp) 6%,var(--paper))}
.slot.on .slot-emoji{filter:none;opacity:1} .slot.on .slot-mark{opacity:1}
.book .actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.book .hint{color:var(--ink2);font-size:.9rem}
/* supply */
.supply{margin:34px 0 60px}
.supply-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
@media (min-width:861px){.supply>.supply-grid{grid-template-columns:1fr 2fr}}
.res-cat h4{font-size:1rem;margin-bottom:6px}
.res-cat ul{margin:0;padding-left:18px;font-size:.92rem}
.res-cat li{margin:3px 0}
.faq details{border-top:1px solid var(--line);padding:8px 0}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin:6px 0 0;color:var(--ink2);font-size:.92rem}
table.sched{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:10px}
table.sched th,table.sched td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.supply-grid .wide{grid-column:1 / -1}
table.sched th{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;color:var(--ink2)}
.tablewrap{overflow-x:auto}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink2);font-size:.85rem}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
/* toast & modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:50;max-width:90vw;box-shadow:var(--shadow);font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--stamp);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,25,30,.55);display:none;place-items:center;z-index:40;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--paper);color:var(--ink);border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .close{float:right}
.cert{border:10px double var(--gold);padding:32px;text-align:center;background:var(--paper)}
.cert h2{font-size:2rem;letter-spacing:.2em}
.cert .name{font-family:var(--f-display);font-size:2.2rem;margin:14px 0 6px;border-bottom:2px solid var(--ink);display:inline-block;padding:0 24px}
.cert p{margin:6px 0;color:var(--ink2)}
.cert .seal{width:110px;height:110px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;transform:rotate(-10deg);margin-top:12px;font-size:1.1rem}
.cert .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:.9rem}
.quiz .q{border-top:1px solid var(--line);padding:10px 0}
.quiz .q p{margin:0 0 6px;font-weight:600}
.quiz label{display:block;padding:4px 0;cursor:pointer}
.quiz .res{margin-top:12px;font-weight:700;font-family:var(--f-display);font-size:1.2rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.teacher-only{display:none}
@media (max-width:860px){.hero{grid-template-columns:1fr}.top .wrap{height:auto;padding:10px 20px;flex-wrap:wrap}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{body{background:#fff}.top,.hero,.map,.island,.book,.supply,footer,.toast{display:none!important}.modal.open{position:static;display:block;background:none;padding:0}.modal .close{display:none}.cert{border-color:#B8860B}}

.tool{max-width:820px;margin:40px auto;padding:0 20px} table.codes{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:.9rem;margin-top:14px} table.codes td,table.codes th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
</style></head><body>
<main class="tool">
  <h1 style="font-size:1.8rem">🧑‍🏫 老師工具：密語對照表</h1>
  <p style="color:var(--ink2)">輸入學員的暱稱，列出該學員每一關應得的通關密語，方便巡堂時核對或協助學員排錯。這一頁不會從入口網頁連結過來；請不要把網址給學員。</p>
  <div class="card" id="gate"><form id="gateForm" class="who" style="display:flex;gap:10px"><input id="pass" type="password" placeholder="通行碼" style="flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink)"><button class="btn btn-sea">進入</button></form></div>
  <div class="card" id="tool" style="display:none;margin-top:16px">
    <form id="lookup" class="who" style="display:flex;gap:10px"><input id="who" placeholder="學員暱稱" style="flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink)"><button class="btn btn-sea">產生對照表</button></form>
    <div id="out"></div>
  </div>
</main>
<script>// 精簡版 SHA-256（純 JS，與 Python hashlib.sha256 結果一致）
function sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const bitLen = bytes.length * 8;
  const padLen = ((bytes.length + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(padLen);
  buf.set(bytes); buf[bytes.length] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000));
  dv.setUint32(padLen - 4, bitLen >>> 0);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padLen; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(W[i-15], 7) ^ rotr(W[i-15], 18) ^ (W[i-15] >>> 3);
      const s1 = rotr(W[i-2], 17) ^ rotr(W[i-2], 19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
